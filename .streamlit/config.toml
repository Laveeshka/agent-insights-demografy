# Demografy brand theme (see docs/4. Demografy Brand Guidelines.pdf)
# Blue + neutral only, tuned for very high contrast:
#   White text on Ultrasonic Blue (main area)  -> 7.51:1
#   White text on Jet Black (sidebar)          -> 14.00:1
[theme]
primaryColor="#ffffff"
backgroundColor="#5e17eb"
secondaryBackgroundColor="#272d2d"
textColor="#ffffff"
font="sans serif"
