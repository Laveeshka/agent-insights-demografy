# Demografy brand theme (see docs/4. Demografy Brand Guidelines.pdf)
# Neutral light + purple gradient direction (Centered Card design).
# The .stApp background gradient is set per-screen in app.py; this is the
# sensible flat fallback plus the widget chrome colours.
[theme]
primaryColor="#5e17eb"
backgroundColor="#faf9fc"
secondaryBackgroundColor="#dbdddc"
textColor="#272d2d"
font="sans serif"
